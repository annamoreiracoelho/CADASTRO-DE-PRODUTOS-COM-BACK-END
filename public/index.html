<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Cadastro de Produtos</h1>

        <form id="formulario">
            <label for="nome">
                Nome do Produto:
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome">

            <label for="preco">
                Preço:
            </label>

            <input
                type="number"
                id="preco"
                step="0.01"
                min="0.01"
                placeholder="Digite o preço">

            <label for="quantidade">
                Quantidade:
            </label>

            <input
                type="number"
                id="quantidade"
                min="0"
                placeholder="Digite a quantidade">
            <button type="submit">
                Cadastrar Produto
            </button>
        </form>

        <h2>Produtos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="tabelaProdutos">
            </tbody>
        </table>
    </main>

    <script src="script.js"></script>

</body>
</html>
